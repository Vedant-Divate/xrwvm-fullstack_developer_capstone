<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Review - {{ dealer.name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container"><a class="navbar-brand" href="/">Best Cars Dealership</a></div>
  </nav>
  <div class="container mt-4">
    <h1>Post a Review for {{ dealer.name }}</h1>
    <form id="review-form">
      <div class="mb-3">
        <label class="form-label">Your review:</label>
        <textarea id="content" class="form-control" rows="4">Fantastic services, friendly staff!</textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Rating (1-5):</label>
        <input id="rating" type="number" min="1" max="5" value="5" class="form-control" />
      </div>
      <button type="submit" class="btn btn-success">Submit Review</button>
    </form>
    <p id="done" class="mt-3"></p>
  </div>
  <script>
    document.getElementById('review-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/reviews/{{ dealer.id }}/add/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          content: document.getElementById('content').value,
          rating: document.getElementById('rating').value
        })
      });
      const data = await res.json();
      document.getElementById('done').textContent = data.message || data.error;
      if (data.review) window.location = '/dealer/{{ dealer.id }}/';
    });
  </script>
</body>
</html>
